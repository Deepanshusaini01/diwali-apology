<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A Light of Hope</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/pages.css">
  <style>
    .diya-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 320px;
      margin: 2rem auto;
      padding: 2rem;
    }

    .diya-ambient {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 180, 0, 0.25) 0%, rgba(255, 120, 0, 0.1) 40%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      opacity: 0;
      transition: opacity 1.5s ease;
      pointer-events: none;
      z-index: 1;
    }

    .diya-ambient.lit {
      opacity: 1;
      animation: breathe 3s ease-in-out infinite;
    }

    .diya-construction {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 3;
    }

    .diya-wick {
      width: 2px;
      height: 18px;
      background: linear-gradient(to top, #3a2a1a, #2a1a0a);
      margin-bottom: 0px;
      z-index: 3;
    }

    .diya-flame {
      position: relative;
      width: 60px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.8s ease;
      margin-bottom: -12px;
      z-index: 4;
    }

    .diya-flame.lit {
      opacity: 1;
    }

    .flame-aura {
      position: absolute;
      width: 50px;
      height: 65px;
      background: radial-gradient(ellipse at center bottom, rgba(255, 200, 50, 0.6), rgba(255, 140, 0, 0.3), transparent);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      filter: blur(8px);
      animation: flameFlicker 2s ease-in-out infinite;
    }

    .flame-core {
      position: relative;
      width: 14px;
      height: 35px;
      background: linear-gradient(to top, #ff6600, #ffaa00, #ffdd44, #fff8e0);
      border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
      box-shadow: 0 0 15px rgba(255, 180, 0, 0.8), 0 0 30px rgba(255, 140, 0, 0.5), 0 0 50px rgba(255, 100, 0, 0.3);
      animation: flameFlicker 1.5s ease-in-out infinite alternate, flameDance 3s ease-in-out infinite;
      z-index: 5;
    }

    @keyframes flameDance {
      0%, 100% { transform: skewX(0deg) scaleY(1); }
      25% { transform: skewX(3deg) scaleY(1.05); }
      50% { transform: skewX(-2deg) scaleY(0.95); }
      75% { transform: skewX(4deg) scaleY(1.02); }
    }

    .clay-diya {
      position: relative;
      width: 140px;
      height: 80px;
      background: linear-gradient(180deg, #d4760a 0%, #b85c0a 30%, #8b4513 60%, #654321 100%);
      border-radius: 0 0 50% 50% / 0 0 100% 100%;
      box-shadow: inset 0 -10px 20px rgba(0,0,0,0.3), inset 0 5px 10px rgba(255,200,100,0.15), 0 8px 20px rgba(0,0,0,0.4);
      z-index: 3;
    }

    .clay-diya::before {
      content: '';
      position: absolute;
      top: -4px;
      left: -8px;
      right: -8px;
      height: 10px;
      background: linear-gradient(180deg, #c4680a, #d4760a);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      box-shadow: 0 -2px 5px rgba(255,200,100,0.1);
    }

    .clay-diya::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 10%;
      right: 10%;
      height: 15px;
      background: linear-gradient(180deg, rgba(255,200,100,0.12), transparent);
      border-radius: 50%;
    }

    #diya-particle-canvas {
      position: absolute;
      inset: -100px;
      pointer-events: none;
      z-index: 5;
    }

    .diya-controls {
      text-align: center;
      margin-top: 2rem;
      z-index: 10;
      position: relative;
    }

    .diya-controls .btn-next {
      font-size: 1.1rem;
      padding: 0.9rem 2.5rem;
      cursor: pointer;
    }

    .diya-controls .btn-next:disabled {
      opacity: 0.4;
      cursor: default;
      pointer-events: none;
    }

    .diya-message {
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      font-size: 1.05rem;
      color: #FFF1D6;
      text-align: center;
      margin-top: 1.5rem;
      opacity: 0;
      transition: opacity 1s ease 0.5s;
      line-height: 1.8;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .diya-message.visible {
      opacity: 1;
    }

    @media (max-width: 480px) {
      .diya-stage {
        min-height: 260px;
        padding: 1.5rem;
      }
      .clay-diya {
        width: 110px;
        height: 65px;
      }
      .diya-message {
        font-size: 0.95rem;
        padding: 0 0.5rem;
      }
    }
  </style>
</head>
<body class="page-diya">

  <div class="page-transition-overlay"></div>

  <!-- Fireworks canvas (background) -->
  <canvas id="fireworks-canvas" style="position:fixed;inset:0;z-index:0;pointer-events:none;"></canvas>

  <div class="floating-container"></div>

  <div class="page-wrapper">

    <h2 class="section-heading glow-text" style="font-family:'Great Vibes',cursive;color:#D4A64A;text-align:center;font-size:3rem;">A Light of Hope</h2>

    <div class="decorative-line"></div>

    <div class="diya-stage">

      <div class="diya-ambient" id="diya-ambient"></div>

      <canvas id="diya-particle-canvas" width="500" height="500" style="position:absolute;inset:-100px;pointer-events:none;z-index:5;"></canvas>

      <div class="diya-construction">
        <div class="diya-flame" id="diya-flame">
          <div class="flame-aura"></div>
          <div class="flame-core"></div>
        </div>
        <div class="diya-wick"></div>
        <div class="clay-diya"></div>
      </div>

    </div>

    <div class="diya-controls">
      <button id="light-diya-btn" class="btn-next" style="cursor:pointer; box-shadow: 0 0 25px rgba(255, 180, 0, 0.4);">🔥 Light This Diya 🪔</button>
      <p id="diya-message" class="diya-message">May this light bring peace, happiness and beautiful beginnings.</p>
    </div>

    <div class="nav-buttons" id="diya-nav" style="margin-top:2.5rem;">
      <a href="reflection.html" class="btn-prev" onclick="navigateTo('reflection.html'); return false;">Previous</a>
      <a href="wishes.html" class="btn-next" id="diya-continue-btn" style="opacity:0.35; pointer-events:none; filter:grayscale(0.6); transition: all 0.6s ease;" onclick="navigateTo('wishes.html'); return false;">Continue →</a>
    </div>

  </div>

  <script src="js/fireworks.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/common.js"></script>
  <script src="js/diya.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof initFireworks === 'function') {
        window.fireworksInstance = initFireworks('fireworks-canvas', 0.008);
      }
    });
  </script>
</body>
</html>
